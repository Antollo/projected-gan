[project]
name = "projected-gan"
version = "0.1.0"
requires-python = ">=3.9.0,<3.10.0"
dependencies = [
    "torch==2.1.2",
    "torchvision==0.16.2",
    "timm==0.4.12",
    "imageio==2.9.0",
    "click==8.0.3",
    "tqdm==4.62.2",
    "numpy==1.21.2",
    "dill==0.3.2",
    "psutil==5.8.0",
    "scipy==1.7.1",
    "setuptools==58.0.4",
    "tensorboard==2.7.0",
    "protobuf==3.20.3",
    "six==1.16.0",
    "lpips<=0.1.4",
    "kornia<=0.8.2",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cu121" }]
torchvision = [{ index = "pytorch-cu121" }]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
